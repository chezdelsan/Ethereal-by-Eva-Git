<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Ethereal by Eva</title>
    <meta name="description" content="Your shopping cart.">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="/" class="logo">Ethereal by Eva</a>
            <nav class="nav">
                <a href="/">Home</a>
                <a href="browse.html">Shop</a>
                <a href="browse.html?category=painting">Paintings</a>
                <a href="gallery.html">Gallery</a>
            </nav>
            <div class="header-actions">
                <a href="cart.html" class="cart-link active">
                    Cart <span class="cart-count" data-count="0">0</span>
                </a>
            </div>
        </div>
    </header>
    
    <main>
        <div class="container" style="padding-top: var(--spacing-lg); padding-bottom: var(--spacing-lg);">
            <h1 style="margin-bottom: var(--spacing-md);">Your Cart</h1>
            <div id="cart-content">
                <div class="loading">Loading</div>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <div class="container footer-inner">
            <p class="footer-text">© 2024 Ethereal by Eva. All pieces are one-of-a-kind.</p>
            <div class="footer-links">
                <a href="gallery.html">Gallery</a>
                <a href="contact.html">Contact</a>
                <a href="shipping.html">Shipping</a>
            </div>
        </div>
    </footer>
    
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        const cartContent = document.getElementById('cart-content');
        
        function renderEmptyCart() {
            cartContent.innerHTML = `
                <div class="cart-empty">
                    <h2>Your cart is empty</h2>
                    <p style="margin-bottom: var(--spacing-md);">Looks like you haven't added any pieces yet.</p>
                    <a href="browse.html" class="btn btn-primary">Continue Shopping</a>
                </div>
            `;
        }
        
        function renderCart(items) {
            if (!items || items.length === 0) {
                renderEmptyCart();
                return;
            }
            
            const subtotal = items.reduce((sum, item) => sum + item.price, 0);
            
            cartContent.innerHTML = `
                <div class="cart-container">
                    <div class="cart-items">
                        ${items.map(item => `
                            <div class="cart-item" data-piece-id="${item.piece_id}">
                                <div class="cart-item-image">
                                    <a href="piece.html?id=${item.piece_id}">
                                        <img src="${item.image_url || 'https://via.placeholder.com/120?text=No+Image'}" alt="${item.title}">
                                    </a>
                                </div>
                                <div class="cart-item-info">
                                    <h3 class="cart-item-title"><a href="piece.html?id=${item.piece_id}">${item.title}</a></h3>
                                    <p style="color: var(--color-text-light);">One-of-a-kind piece</p>
                                    <span class="cart-item-price">${Utils.formatPrice(item.price)}</span>
                                    <button type="button" class="cart-item-remove" data-piece-id="${item.piece_id}">Remove</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="cart-summary">
                        <h2>Order Summary</h2>
                        <div class="cart-summary-row">
                            <span>Subtotal (${items.length} item${items.length > 1 ? 's' : ''})</span>
                            <span>${Utils.formatPrice(subtotal)}</span>
                        </div>
                        <div class="cart-summary-row">
                            <span>Shipping</span>
                            <span>$12.95</span>
                        </div>
                        <div class="cart-summary-row cart-summary-total">
                            <span>Total</span>
                            <span>${Utils.formatPrice(subtotal + 1295)}</span>
                        </div>
                        <a href="checkout.html" class="btn btn-primary btn-full" style="margin-top: var(--spacing-md);">Proceed to Checkout</a>
                        <p style="text-align: center; margin-top: var(--spacing-md);">
                            <a href="browse.html" style="color: var(--color-text-light);">Continue Shopping</a>
                        </p>
                    </div>
                </div>
            `;
            
            // Attach event listeners to remove buttons
            document.querySelectorAll('.cart-item-remove').forEach(btn => {
                btn.addEventListener('click', function() {
                    const pieceId = parseInt(this.getAttribute('data-piece-id'));
                    removeItem(pieceId);
                });
            });
        }
        
        function removeItem(pieceId) {
            Cart.removeItem(pieceId);
            loadCart();
        }
        
        async function loadCart() {
            const items = Cart.getItems();
            
            if (items.length === 0) {
                renderEmptyCart();
                return;
            }
            
            // Try to validate with backend, but show local cart if it fails
            try {
                const pieceIds = items.map(item => item.piece_id);
                const validated = await API.validateCart(pieceIds);
                Cart.saveItems(validated.items);
                renderCart(validated.items);
            } catch (error) {
                console.warn('Cart validation failed, showing local data:', error);
                // Show local cart data even if backend is down
                renderCart(items);
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
